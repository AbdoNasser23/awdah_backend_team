.content{max-width:1500px;margin:auto;padding:30px 34px 55px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:1.35px;text-transform:uppercase;font-weight:800;color:var(--primary);margin-bottom:7px}.page-head h1{font:800 26px/1.2 Manrope;margin:0;letter-spacing:-.8px}.page-head p{color:var(--muted);margin:8px 0 0;font-size:13px}.btn{border:0;background:var(--primary);color:#fff;padding:9px 14px;border-radius:9px;font-weight:700;font-size:12px;box-shadow:0 4px 10px #5558d926}.btn:hover{background:#4649c5}.btn.secondary{background:#fff;color:#526076;border:1px solid var(--line);box-shadow:none}.btn.soft{background:var(--primary-soft);color:var(--primary);box-shadow:none}.btn.danger{background:var(--red-soft);color:var(--red);box-shadow:none}.btn.small{padding:6px 10px;font-size:11px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card-pad{padding:18px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat{padding:18px 19px;position:relative;overflow:hidden}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600}.stat-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-size:15px}.stat-value{font:800 29px Manrope;margin:12px 0 2px;letter-spacing:-1px}.stat-note{font-size:11px;color:var(--muted)}.dashboard-grid{grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr);align-items:start}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title h2{font:800 15px Manrope;margin:0}.section-title span{font-size:11px;color:var(--muted)}.progress-card{padding:20px}.progress-line{display:flex;justify-content:space-between;align-items:end;margin-bottom:11px}.progress-line s #fafbfe;padding:12px 14px;border-bottom:1px solid var(--line)}.data-table td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:#fcfcff}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:30px;font-size:10px;font-weight:700;white-space:nowrap;background:#f0f2f7;color:#68758a}.badge.done{background:var(--green-soft);color:var(--green)}.badge.progress{background:var(--blue-soft);color:var(--blue)}.badge.blocked{background:var(--red-soft);color:var(--red)}.badge.waiting{background:var(--amber-soft);color:var(--amber)}.badge.method-get{background:#e9f6ef;color:#16865d}.badge.method-post{background:#eaf2ff;color:#2875c7}.badge.method-put,.badge.method-patch{background:#fff5df;color:#a56b13}.badge.method-delete{background:#fff0f1;color:#c34c59}.phase-layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:16px}.phase-menu{padding:10px}.phase-menu button{width:100%;text-align:left;border:0;background:transparent;padding:11px;border-radius:9px;color:#657187;font-size:12px;margin:2px 0}.phase-menu button.active{background:var(--primary-soft);color:var(--primary);font-weight:700}.phase-menu small{display:block;color:#9aa4b4;font-size:10px;margin-top:3px}.task-row{display:grid;grid-template-columns:22px minmax(0,1fr) 150px 120px;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}.task-row:last-child{border:0}.task-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}.task-name{font-size:12px;font-weight:600}.task-name.completed{text-decoration:line-through;color:#9aa4b4}.task-sub{font-size:10px;color:var(--muted);margin-top:3px}.task-row select{padding:6px 8px;font-size:10px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-field label{display:block;font-size:10px;font-weight:800;color:#6d788b;margin:0 0 6px}.form-field.full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#17203366;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-backdrop.open{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 25px 80px #17203333}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font:800 16px Manrope;margin:0}.modal-body{padding:20px 22px}.modal-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:#f3f5f9;width:30px;height:30px;border-radius:8px;color:#6c788b;font-size:17px}.record-card{padding:15px 16px;margin-bottom:10px}.record-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.record-head h3{font-size:13px;margin:0}.record-meta{font-size:10px;color:var(--muted);margin-top:5px}.record-desc{font-size:11px;color:#657187;margin:10px 0 0;white-space:pre-wrap}.code{font:11px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#f6f7fb;padding:12px;border-radius:9px;overflow:auto;white-space:pre-wrap;word-break:break-word}.endpoint-path{font:600 12px ui-monospace,monospace;color:#313b50}.endpoint-detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:13px}.detail-box{background:#f8f9fc;border:1px solid var(--line);padding:10px;border-radius:10px}.detail-box small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:800;letter-spacing:.6px}.detail-box strong{font-size:11px;display:block;margin-top:4px;overflow-wrap:anywhere}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tabs button{border:0;background:transparent;padding:10px 12px;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap;border-bottom:2px solid transparent}.tabs button.active{color:var(--primary);border-color:var(--primary)}.toast{position:fixed;bottom:22px;right:24px;background:#182230;color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);font-size:12px;z-index:80;display:none}.mobile-menu{display:none}
@media(max-width:1100px){.sidebar{width:220px}.main{margin-left:220px}.content{padding:25px 22px}.topbar{padding:0 22px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s;width:260px;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile-menu{display:inline-flex;border:0;background:#f1f2fa;border-radius:8px;padding:7px 10px;margin-right:10px}.topbar{height:62px;padding:0 15px}.content{padding:22px 15px}.top-actions{gap:6px}.user-input{width:105px!important}.crumb{display:flex;align-items:center}.page-head{flex-direction:column}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:24px}.dashboard-grid,.phase-layout{grid-template-columns:1fr}.phase-menu{display:flex;overflow:auto;gap:4px}.phase-menu button{min-width:150px}.task-row{grid-template-columns:20px minmax(0,1fr);}.task-row select{grid-column:2}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.endpoint-detail{grid-template-columns:1fr 1fr}.hide-mobile{display:none}}

<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">A</div><div><div class="brand-name">Aw<span>dah</span></div><div class="brand-caption">Backend Project Hub</div></div></div>
  <div class="nav-label">WORKSPACE</div>
  <div class="nav" id="nav">
    <button data-tab="dash" class="active"><span class="nav-icon">▦</span>Overview</button>
    <button data-tab="ph"><span class="nav-icon">☷</span>Phases & Tasks</button>
    <button data-tab="stories"><span class="nav-icon">◇</span>User Stories</button>
  </div>
  <div class="nav-label">ARCHITECTURE</div>
  <div class="nav">
    <button data-tab="erd"><span class="nav-icon">▤</span>ERD & Database</button>
    <button data-tab="migrations"><span class="nav-icon">⇄</span>Migrations</button>
    <button data-tab="models"><span class="nav-icon">◫</span>Models</button>
    <button data-tab="controllers"><span class="nav-icon">⌘</span>Controllers</button>
    <button data-tab="routes"><span class="nav-icon">⌁</span>Routes</button>
    <button data-tab="endpoints"><span class="nav-icon">↗</span>Endpoints</button>
    <button data-tab="services"><span class="nav-icon">⚙</span>Services</button>
  </div>
  <div class="nav-label">API & QUALITY</div>
  <div class="nav">
    <button data-tab="api"><span class="nav-icon">▣</span>Requests & Resources</button>
    <button data-tab="security"><span class="nav-icon">♢</span>Auth & Security</button>
    <button data-tab="testing"><span class="nav-icon">✓</span>Testing</button>
    <button data-tab="docs"><span class="nav-icon">▧</span>Documentation</button>
  </div>
  <div class="nav-label">TEAM</div>
  <div class="nav"><button data-tab="team"><span class="nav-icon">♙</span>Team & Activity</button></div>
  <div class="sidebar-bottom"><div class="project-chip"><strong>Awdah · REST API</strong><small>Laravel backend workspace</small></div></div>
</aside>
<section class="main">
<header class="topbar"><div class="crumb"><button class="mobile-menu" id="mobileMenu">☰</button><span>Workspace&nbsp; / &nbsp;</span><strong id="crumb">Overview</strong></div><div class="top-actions"><span class="sync off" id="sync">Local workspace</span><input id="me" class="user-input" placeholder="Your name" aria-label="Your name"><div class="avatar" id="avatar">?</div></div></header>
<main class="content" id="app"></main>
</section>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Add item</h2><button class="close" id="modalClose">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button class="btn secondary" id="modalCancel">Cancel</button><button class="btn" id="modalSave">Save item</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
/* Original project roadmap and task wording are intentionally retained. */
const PH=[
{id:1,t:"Project setup",s:"Laravel, MariaDB, storage",n:[],tasks:["Install Laravel API, JWT authentication, Pest, Pint","MinIO disk named photos, plus Mailpit","Health endpoint with a test"]},
{id:2,t:"API foundation",s:"Response format, errors, limits",n:[1],tasks:["ApiResponse helper with one JSON shape","Exception handler: 401/403/404/422/429 as JSON","Rate limiters: auth, codes, search","Enums"]},
{id:3,t:"Auth",s:"Stories 1 to 4",n:[2],tasks:["Users and verification codes tables","Register, verify, resend code","Login and logout","Forgot and reset password","Share API docs with mobile team"]},
{id:4,t:"Reports: write side",s:"Stories 5 to 9, 12",n:[3],tasks:["Reports and photos tables","Create and edit drafts","Photo upload and case code","Publish with validation","Close, delete, policy"]},
{id:5,t:"Reports: read side",s:"Stories 10 to 15",n:[4],tasks:["Public vs owner resources","Public list with filters and search","My reports (drafts included)","Seed 10k reports and test speed"]},
{id:6,t:"AI layer (fake first)",s:"Story 26",n:[4],tasks:["FaceMatchingService interface","Fake service as default binding","Index and remove jobs with retries"]},
{id:7,t:"Notifications",s:"Stories 22 and 23",n:[2],tasks:["Notifications and device tokens tables","Notifications API: list, read, unread count","FCM channel, faked in tests"]},
{id:8,t:"Matching",s:"Stories 19 to 21",n:[4,6,7],tasks:["Matches table with unique pair","Matching jobs in both directions","Confirm closes both reports and notifies","Reject hides the match only"]},
{id:9,t:"Photo search",s:"Stories 16 to 18, 24, 27",n:[3,6],tasks:["Face consent and middleware","Searches table","Photo search and age progression","Purge expired searches (24h)"]},
{id:10,t:"Reminders and profile",s:"Stories 25 and 30",n:[7,8],tasks:["2-day match reminder","30-day open report reminder","GET /me without national ID"]},
{id:11,t:"Hardening and real AI",s:"Stories 28 and 29",n:[0],tasks:["Swap fake for real AI service","Review resources and rate limits","API docs and Postman collection","Supervisor, cron, backups","End-to-end scenario test"]}
];
const TABS={dash:"Overview",ph:"Phases & Tasks",stories:"User Stories",erd:"ERD & Database",migrations:"Migrations",models:"Models",controllers:"Controllers",routes:"Routes",endpoints:"Endpoints",services:"Services",api:"Requests & Resources",security:"Auth & Security",testing:"Testing",docs:"Documentation",team:"Team & Activity"};
const COLLECTIONS=["tasks","erd","mig","models","controllers","routes","endpoints","services","api","security","testing","docs","stories"];
let tab="dash",selPh=1,dbc=null,me="",S={};COLLECTIONS.forEach(c=>S[c]={});
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tid=(p,i)=>p+"-"+i,ALL=PH.flatMap(p=>p.tasks.map((t,i)=>({id:tid(p.id,i),t,p:p.id}))),T=S.tasks;
const pct=(a,b)=>b?Math.round(a/b*100):0,isDone=id=>!!(T[id]&&T[id].done),phStat=p=>{let d=p.tasks.filter((_,i)=>isDone(tid(p.id,i))).length;return{d,n:p.tasks.length,pc:pct(d,p.tasks.length)}},phDone=p=>phStat(p).pc===100;
function toast(msg){let e=$("#toast");e.textContent=msg;e.style.display="block";clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display="none",2400)}
function persistLocal(){try{localStorage.setItem("awdah-hub-data",JSON.stringify(S))}catch(e){}}
function setSync(on,msg){let e=$("#sync");e.className="sync "+(on?"on":"off");e.textContent=msg||(on?"Synced with team":"Local workspace")}
async function save(col,id,data){S[col][id]=data;persistLocal();render();if(dbc){try{await dbc.doc(col+"/"+id).set(data);setSync(true)}catch(e){setSync(false,"Sync issue · local saved")}}}
async function del(col,id){delete S[col][id];persistLocal();render();if(dbc){try{await dbc.doc(col+"/"+id).delete()}catch(e){setSync(false,"Sync issue · local saved")}}}
const wr=(id,p)=>save("tasks",id,Object.assign({},T[id],p,{by:me||"Team member",at:Date.now()}));
function escAttr(s){return esc(s).replace(/`/g,"&#96;")}
function pageHead(k,desc,action=""){return `<div class="page-head"><div><div class="eyebrow">AWDAH BACKEND WORKSPACE</div><h1>${TABS[k]}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,value,note,icon){return `<div class="card stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function dash(){
 const d=ALL.filter(x=>isDone(x.id)).length,n=ALL.length,cur=PH.find(p=>!phDone(p)),doing=ALL.filter(x=>!isDone(x.id)&&T[x.id]&&T[x.id].owner).length,blocked=ALL.filter(x=>T[x.id]?.status==="Blocked"&&!isDone(x.id)).length;
 const activity=Object.entries(T).filter(([,v])=>v.at).sort((a,b)=>b[1].at-a[1].at).slice(0,6);
 const phases=PH.map(p=>{let s=phStat(p);return `<div class="phase-row" data-go="${p.id}"><div class="phase-number">${p.id}</div><div><h3>${esc(p.t)}</h3><p>${esc(p.s)}</p></div><div class="phase-meta">${s.pc}%<div class="mini-track"><i style="width:${s.pc}%"></i></div></div></div>`}).join("");
 return `${pageHead("dash","A clear view of delivery progress, current work, and what needs attention.")}<div class="grid stats">${stat("Overall progress",pct(d,n)+"%",d+" of "+n+" roadmap tasks completed","◉")}${stat("In progress",doing,"Assigned and not completed","◷")}${stat("Blocked tasks",blocked,"Tasks marked as blocked","!")}${stat("Project phases",PH.length,"Planned phases in the original roadmap","▦")}</div>
 <div class="grid dashboard-grid"><div class="grid"><div class="card progress-card"><div class="progress-line"><div><div class="muted" style="font-size:11px;font-weight:700">PROJECT DELIVERY</div><strong>${pct(d,n)}%</strong></div><span class="badge ${d===n?"done":"progress"}">${d===n?"All roadmap tasks done":"In progress"}</span></div><div class="progress-track"><i style="width:${pct(d,n)}%"></i></div><div class="muted" style="font-size:11px;margin-top:10px">${d} completed · ${n-d} remaining across all phases</div></div>
 <div class="card card-pad"><div class="section-title"><h2>Project roadmap</h2><span>11 phases · original plan</span></div><div class="phase-list">${phases}</div></div></div>
 <div class="grid"><div class="card card-pad"><div class="section-title"><h2>Current focus</h2><span>Next incomplete phase</span></div>${cur?`<h3 style="font:800 17px Manrope;margin:4px 0 6px">${cur.id}. ${esc(cur.t)}</h3><p class="muted" style="font-size:11px;margin:0 0 15px">${esc(cur.s)}</p><div class="progress-track"><i style="width:${phStat(cur).pc}%"></i></div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--muted)"><span>${phStat(cur).d}/${phStat(cur).n} tasks</span><button class="btn soft small" data-go="${cur.id}">Open phase →</button></div>`:`<div class="empty">All roadmap tasks are complete.</div>`}</div>
 <div class="card card-pad"><div class="section-title"><h2>Recent activity</h2><span>Latest updates</span></div><div class="activity-list">${activity.length?activity.map(([id,v])=>{let x=ALL.find(a=>a.id===id);return x?`<div class="activity-item"><b>${esc(v.by||"Team member")}</b> ${v.done?"completed":"updated"} “${esc(x.t)}”<small>${new Date(v.at).toLocaleString()}</small></div>`:""}).join(""):'<div class="empty">No activity yet. Start updating tasks to see team activity here.</div>'}</div></div></div></div>`;
}
function phases(){let p=PH.find(x=>x.id===selPh),team=[...new Set(Object.values(T).map(s=>s.owner).filter(Boolean).concat(me?[me]:[]))],s=phStat(p);
 return `${pageHead("ph","Track each original roadmap task, assign ownership, and update delivery status.")}<div class="phase-layout"><div class="card phase-menu">${PH.map(x=>{let z=phStat(x);return `<button class="${x.id===selPh?"active":""}" data-ph="${x.id}"><b>${x.id}. ${esc(x.t)}</b><small>${z.d}/${z.n} complete · ${z.pc}%</small></button>`}).join("")}</div><div class="card card-pad"><div class="section-title"><div><h2>${p.id}. ${esc(p.t)}</h2><span>${esc(p.s)}${p.n.length?" · Dependencies: "+p.n.map(k=>k?PH[k-1].t:"all phases").join(", "):""}</span></div><span class="badge ${s.pc===100?"done":"progress"}">${s.pc}% complete</span></div><div class="progress-track" style="margin-bottom:15px"><i style="width:${s.pc}%"></i></div>${p.tasks.map((t,i)=>{let id=tid(p.id,i),v=T[id]||{},status=v.status||(v.done?"Completed":"Not Started");return `<div class="task-row"><input type="checkbox" data-check="${id}" ${v.done?"checked":""}><div><div class="task-name ${v.done?"completed":""}">${esc(t)}</div><div class="task-sub">${v.by?"Last updated by "+esc(v.by):"Not updated yet"}</div></div><select data-status="${id}">${["Not Started","In Progress","In Review","Completed","Blocked"].map(x=>`<option ${status===x?"selected":""}>${x}</option>`).join("")}</select><select data-owner="${id}"><option value="">Unassigned</option>${team.concat(v.owner&&!team.includes(v.owner)?[v.owner]:[]).map(x=>`<option ${v.owner===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>`}).join("")}<p class="muted" style="font-size:10px;margin:14px 0 0">To assign a task, enter your name in the top bar. Your name will be available in the owner lists.</p></div></div>`;
}
function recordList(col,title,desc,fields,extra=""){let items=Object.entries(S[col]||{}).sort((a,b)=>(b[1].at||0)-(a[1].at||0));return `${pageHead(tab,desc,`<button class="btn" data-add="${col}">＋ Add ${title}</button>`)}<div class="toolbar"><input id="recordSearch" placeholder="Search ${title.toLowerCase()}..." style="max-width:300px"><select id="recordStatus" style="max-width:170px"><option value="">All statuses</option>${["Planned","In Progress","In Review","Completed","Blocked"].map(x=>`<option>${x}</option>`).join("")}</select></div><div id="recordList">${items.length?items.map(([id,v])=>recordCard(col,id,v,fields,extra)).join(""):`<div class="card empty">No ${title.toLowerCase()} have been added yet. Use “Add ${title}” to document the real project components.</div>`}</div>`}
function recordCard(col,id,v,fields,extra){let status=v.status||"Planned";return `<div class="card record-card" data-record="${col}" data-search="${escAttr([v.name,v.description,v.uri,v.method,v.controller,v.action,v.table,v.model,v.notes].join(" ").toLowerCase())}" data-status="${escAttr(status)}"><div class="record-head"><div><h3>${esc(v.name||v.uri||"Untitled")}</h3><div class="record-meta">${fields.map(f=>v[f]?esc(v[f]):"").filter(Boolean).join(" · ")}</div></div><div style="display:flex;gap:6px;align-items:center"><span class="badge ${status==="Completed"?"done":status==="Blocked"?"blocked":status==="In Progress"?"progress":"waiting"}">${esc(status)}</span><button class="btn secondary small" data-edit="${col}|${id}">Edit</button><button class="btn danger small" data-delete="${col}|${id}">×</button></div></div>${v.description?`<p class="record-desc">${esc(v.description)}</p>`:""}${extra(v)}</div>`}
const schemas={
models:{title:"Model",desc:"Document Eloquent models, their tables, relationships, casts, and mass-assignable attributes.",fields:[["name","Model name","text","e.g. User"],["table","Database table","text","e.g. users"],["fillable","Fillable","textarea","Comma-separated attributes"],["casts","Casts","textarea","Attribute casts"],["relationships","Relationships","textarea","hasMany, belongsTo, etc."],["status","Status","status"]],meta:["table","relationships"],extra:v=>`<div class="record-meta">Fillable: ${esc(v.fillable||"—")} · Casts: ${esc(v.casts||"—")}</div>`},
controllers:{title:"Controller",desc:"Track controller classes and the methods responsible for each API operation.",fields:[["name","Controller name","text","e.g. AuthController"],["namespace","Namespace","text","e.g. App\\Http\\Controllers\\Api\\V1"],["methods","Methods","textarea","One method per line"],["responsibility","Responsibility","textarea","What this controller handles"],["status","Status","status"]],meta:["namespace"],extra:v=>`<div class="record-meta">Methods: ${esc(v.methods||"—")}</div>`},
routes:{title:"Route",desc:"Keep an inventory of api.php routes, their middleware, names, and controller actions.",fields:[["method","HTTP method","select","GET,POST,PUT,PATCH,DELETE"],["uri","URI","text","/api/v1/..."],["name","Route name","text","Optional route name"],["action","Controller action","text","Controller@method"],["middleware","Middleware","text","auth:api, etc."],["status","Status","status"]],meta:["method","uri","action","middleware"],extra:v=>`<div class="record-meta">Route: <span class="endpoint-path">${esc(v.method||"GET")} ${esc(v.uri||"")}</span> · ${esc(v.action||"Controller action not linked")}</div>`},
endpoints:{title:"Endpoint",desc:"Maintain the REST API contract: method, URL, controller action, authentication, payload, and responses.",fields:[["name","Endpoint name","text","e.g. Register user"],["method","HTTP method","select","GET,POST,PUT,PATCH,DELETE"],["uri","Endpoint URI","text","/api/v1/auth/register"],["description","Description","textarea","What this endpoint does"],["controller","Controller","text","AuthController"],["action","Controller method","text","register"],["request","Request / validation","textarea","Request class and validation rules"],["auth","Authentication","select","Public,JWT required"],["middleware","Middleware","text","api, auth:api, throttle..."],["body","Request body example","textarea","JSON example"],["success","Success response","textarea","JSON response example"],["errors","Error responses","textarea","401, 403, 422..."],["related","Related story / task","text","Story ID or task"],["status","Status","status"]],meta:["method","uri","controller","action"],extra:v=>`<div class="endpoint-detail"><div class="detail-box"><small>Authentication</small><strong>${esc(v.auth||"Not specified")}</strong></div><div class="detail-box"><small>Request</small><strong>${esc(v.request||"Not documented")}</strong></div><div class="detail-box"><small>Middleware</small><strong>${esc(v.middleware||"—")}</strong></div></div>${v.body?`<p class="record-meta">Request body</p><pre class="code">${esc(v.body)}</pre>`:""}${v.success?`<p class="record-meta">Success response</p><pre class="code">${esc(v.success)}</pre>`:""}${v.errors?`<p class="record-meta">Error responses</p><pre class="code">${esc(v.errors)}</pre>`:""}`},
services:{title:"Service",desc:"Track service classes, their responsibilities, dependencies, and related features.",fields:[["name","Service name","text","e.g. FaceMatchingService"],["responsibility","Responsibility","textarea","Business logic handled"],["dependencies","Dependencies","textarea","Injected services / external systems"],["usedBy","Used by","text","Controller / Job / Listener"],["status","Status","status"]],meta:["usedBy"],extra:v=>`<div class="record-meta">Dependencies: ${esc(v.dependencies||"—")}</div>`},
api:{title:"API component",desc:"Track Form Requests, API Resources, middleware, policies, and shared response components.",fields:[["name","Component name","text","e.g. RegisterRequest"],["type","Component type","select","Form Request,API Resource,Middleware,Policy,ApiResponse,Exception Handler,Enum"],["responsibility","Responsibility","textarea","Purpose and behavior"],["rules","Rules / behavior","textarea","Validation rules, mapping, permissions..."],["related","Related endpoint / feature","text","Endpoint or story"],["status","Status","status"]],meta:["type","related"],extra:v=>`<div class="record-meta">${esc(v.rules||"")}</div>`},
security:{title:"Security item",desc:"Track JWT authentication, authorization, token lifecycle, and API protection decisions.",fields:[["name","Security item","text","e.g. JWT token refresh"],["type","Category","select","JWT Authentication,Authorization,Token Refresh,Token Expiration,Middleware,Rate Limiting,CORS,Other"],["details","Implementation notes","textarea","Document the chosen implementation"],["related","Related routes / endpoints","text","Route names or endpoint paths"],["status","Status","status"]],meta:["type","related"],extra:v=>`<div class="record-meta">${esc(v.details||"")}</div>`},
testing:{title:"Test case",desc:"Track Feature and Unit tests, expected behavior, and latest test results.",fields:[["name","Test case","text","e.g. user can register"],["suite","Test suite","select","Feature,Unit,Integration,End-to-End"],["target","Target","text","Endpoint / class / method"],["expected","Expected result","textarea","Expected behavior"],["result","Latest result","select","Not Run,Passed,Failed,Blocked"],["status","Tracking status","status"]],meta:["suite","target","result"],extra:v=>`<div class="record-meta">Expected: ${esc(v.expected||"—")}</div>`},
docs:{title:"Documentation item",desc:"Track API documentation, Postman collections, setup guides, and handoff materials.",fields:[["name","Document name","text","e.g. Authentication API"],["type","Document type","select","API Reference,Postman Collection,Setup Guide,Architecture,Deployment,Other"],["location","Link / location","text","URL or repository path"],["description","Description","textarea","What is covered"],["status","Status","status"]],meta:["type","location"],extra:v=>`<div class="record-meta">${esc(v.description||"")}</div>`},
stories:{title:"User Story",desc:"Track the project's user stories and connect delivery work to the original requirements. Add the source story wording without changing it.",fields:[["storyId","Story ID","text","e.g. US-01"],["name","Story title","text","Story title from requirements"],["description","Original story / acceptance criteria","textarea","Paste the approved wording"],["priority","Priority","select","High,Medium,Low"],["status","Status","status"]],meta:["storyId","priority"],extra:v=>`<div class="record-desc">${esc(v.description||"")}</div>`}
};
function openRecordForm(col,id=null){let schema=schemas[col];if(!schema)return;let old=id?S[col][id]:{},fields=schema.fields.map(([key,label,type,placeholder])=>{let value=old[key]||"";let control=type==="textarea"?`<textarea name="${key}" placeholder="${escAttr(placeholder||"")}">${esc(value)}</textarea>`:type==="status"?`<select name="${key}">${["Planned","In Progress","In Review","Completed","Blocked"].map(x=>`<option ${value===x?"selected":""}>${x}</option>`).join("")}</select>`:type==="select"?`<select name="${key}"><option value="">Select...</option>${placeholder.split(",").map(x=>x.trim()).map(x=>`<option ${value===x?"selected":""}>${esc(x)}</option>`).join("")}</select>`:`<input name="${key}" type="text" value="${escAttr(value)}" placeholder="${escAttr(placeholder||"")}">`;return `<div class="form-field ${type==="textarea"?"full":""}"><label>${label}</label>${control}</div>`}).join("");
 $("#modalTitle").textContent=(id?"Edit ":"Add ")+schema.title;$("#modalBody").innerHTML=`<form id="recordForm" class="form-grid">${fields}</form>`;$("#modalBackdrop").classList.add("open");$("#modalSave").onclick=()=>{let form=$("#recordForm"),data={...old};schema.fields.forEach(([key])=>{let el=form.elements[key];data[key]=el?el.value.trim():""});if(!data.name&&!data.uri){toast("Please enter a name or URI.");return}data.by=me||"Team member";data.at=Date.now();save(col,id||uid(),data);$("#modalBackdrop").classList.remove("open");toast(schema.title+" saved")};}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function erd(){let items=Object.entries(S.erd).sort((a,b)=>(b[1].at||0)-(a[1].at||0));return `${pageHead("erd","Capture the database design tables and their columns. This is a project tracker, not an automatic schema editor.",'<button class="btn" data-add="erd">＋ Add table</button>')}<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${items.length?items.map(([id,e])=>`<div class="card card-pad"><div class="record-head"><div><h3>${esc(e.name)}</h3><div class="record-meta">Added by ${esc(e.by||"Team member")}</div></div><div><button class="btn danger small" data-delete="erd|${id}">×</button></div></div><div style="margin-top:12px">${(e.cols||[]).map(c=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:11px"><span>${esc(c[0])} ${c[2]?`<span class="badge">${esc(c[2])}</span>`:""}</span><span class="muted">${esc(c[1])}</span></div>`).join("")}</div></div>`).join(""):'<div class="card empty">No database tables documented yet.</div>'}</div>`}
function migrations(){let items=Object.entries(S.mig).sort((a,b)=>(b[1].at||0)-(a[1].at||0));return `${pageHead("migrations","Keep migration files and their implementation status together.",'<button class="btn" data-add="mig">＋ Add migration</button>')}${items.length?items.map(([id,m])=>`<div class="card card-pad" style="margin-bottom:12px"><div class="record-head"><div><h3>${esc(m.name)}</h3><div class="record-meta">Added by ${esc(m.by||"Team member")}</div></div><div style="display:flex;gap:6px"><button class="btn secondary small" data-copy="${id}">Copy code</button><button class="btn danger small" data-delete="mig|${id}">×</button></div></div><pre class="code">${esc(m.code)}</pre></div>`).join(""):'<div class="card empty">No migrations documented yet. Add a migration file and its code.</div>'}`}
function addErd(){let name=prompt("Table name (e.g. users):");if(!name)return;let raw=prompt("One column per line: name, type, key (optional)\\nid, bigint, PK\\nemail, string, UQ");if(raw===null)return;let cols=raw.split("\n").map(l=>l.split(",").map(s=>s.trim())).filter(c=>c[0]).map(c=>[c[0],c[1]||"",c[2]||""]);save("erd",uid(),{name,cols,by:me||"Team member",at:Date.now()})}
function addMigration(){let name=prompt("Migration file name:");if(!name)return;let code=prompt("Paste migration code:");if(code===null||!code.trim())return;save("mig",uid(),{name,code,by:me||"Team member",at:Date.now()})}
function team(){let by={};ALL.forEach(x=>{let s=T[x.id];if(s?.owner){by[s.owner]=by[s.owner]||{total:0,done:0};by[s.owner].total++;if(s.done)by[s.owner].done++}});let rows=Object.entries(by);return `${pageHead("team","See task ownership and recent changes made by the team.")}<div class="card card-pad"><div class="section-title"><h2>Team workload</h2><span>${rows.length} members assigned</span></div>${rows.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Member</th><th>Assigned tasks</th><th>Completed</th><th>Progress</th></tr></thead><tbody>${rows.map(([name,v])=>`<tr><td><b>${esc(name)}</b></td><td>${v.total}</td><td>${v.done}</td><td><span class="badge ${v.done===v.total?"done":"progress"}">${pct(v.done,v.total)}%</span></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No team members have been assigned tasks yet. Add your name in the top bar and assign tasks to start tracking workload.</div>'}</div><div class="card card-pad" style="margin-top:16px"><div class="section-title"><h2>Recent activity</h2><span>Task updates</span></div>${Object.entries(T).filter(([,v])=>v.at).sort((a,b)=>b[1].at-a[1].at).slice(0,30).map(([id,v])=>{let x=ALL.find(a=>a.id===id);return x?`<div class="activity-item"><b>${esc(v.by||"Team member")}</b> updated “${esc(x.t)}” <small>${new Date(v.at).toLocaleString()}</small></div>`:""}).join("")||'<div class="empty">No activity yet.</div>'}</div>`}
function render(){let view={dash,ph:phases,erd,migrations,team}[tab];if(!view)view=()=>recordList(tab,schemas[tab].title,schemas[tab].desc,schemas[tab].meta,schemas[tab].extra);$("#app").innerHTML=view();$("#crumb").textContent=TABS[tab];document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("#sidebar").classList.remove("open")}
function changeTab(k){tab=k;render();window.scrollTo(0,0)}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("[data-tab]");if(b)changeTab(b.dataset.tab)});
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>changeTab(b.dataset.tab)));
$("#mobileMenu").onclick=()=>$("#sidebar").classList.toggle("open");
$("#modalClose").onclick=$("#modalCancel").onclick=()=>$("#modalBackdrop").classList.remove("open");
$("#me").value=(()=>{try{return localStorage.getItem("awdah-me")||""}catch(e){return""}})();me=$("#me").value;$("#avatar").textContent=me?me[0].toUpperCase():"?";
$("#me").onchange=e=>{me=e.target.value.trim();try{localStorage.setItem("awdah-me",me)}catch(x){}$("#avatar").textContent=me?me[0].toUpperCase():"?";render()};
$("#app").addEventListener("click",e=>{let t=e.target,g=t.closest("[data-go]");if(g){selPh=+g.dataset.go;changeTab("ph");return}let p=t.closest("[data-ph]");if(p){selPh=+p.dataset.ph;render();return}if(t.dataset.add){if(t.dataset.add==="erd")addErd();else if(t.dataset.add==="mig")addMigration();else openRecordForm(t.dataset.add);return}if(t.dataset.edit){let[c,id]=t.dataset.edit.split("|");openRecordForm(c,id);return}if(t.dataset.delete){let[c,id]=t.dataset.delete.split("|");if(confirm("Delete this item?"))del(c,id);return}if(t.dataset.copy){let code=S.mig[t.dataset.copy]?.code||"";navigator.clipboard?.writeText(code).then(()=>toast("Migration code copied")).catch(()=>toast("Could not access clipboard"));return}});
$("#app").addEventListener("change",e=>{let t=e.target;if(t.dataset.check){let old=T[t.dataset.check]||{};wr(t.dataset.check,{...old,done:t.checked,status:t.checked?"Completed":(old.status==="Completed"?"In Progress":old.status||"Not Started")})}if(t.dataset.status){let old=T[t.dataset.status]||{};wr(t.dataset.status,{...old,status:t.value,done:t.value==="Completed"})}if(t.dataset.owner)wr(t.dataset.owner,{owner:t.value})});
$("#app").addEventListener("input",e=>{if(e.target.id==="recordSearch"||e.target.id==="recordStatus"){let q=$("#recordSearch")?.value.toLowerCase()||"",st=$("#recordStatus")?.value||"";document.querySelectorAll("[data-record]").forEach(el=>{el.style.display=(el.dataset.search.includes(q)&&(!st||el.dataset.status===st))?"":"none"})}});
function loadLocal(){try{let raw=localStorage.getItem("awdah-hub-data");if(raw){let parsed=JSON.parse(raw);COLLECTIONS.forEach(c=>{if(parsed[c]&&typeof parsed[c]==="object")Object.assign(S[c],parsed[c])})}}catch(e){}}
loadLocal();render();
/* Keep the original Claude DB integration pattern and collection names, extending it for the new trackers. */
(async()=>{try{if(typeof claude!=="undefined"&&claude.use){dbc=await claude.use("db");if(!dbc)return;let pending=COLLECTIONS.map(col=>new Promise(resolve=>{try{dbc.collection(col).onSnapshot(s=>{S[col]={};s.docs.forEach(d=>S[col][d.id]=d.data());persistLocal();setSync(true);render();resolve()},()=>{setSync(false,"Sync unavailable · local saved");resolve()})}catch(e){resolve()}}));await Promise.race([Promise.all(pending),new Promise(r=>setTimeout(r,9000))]);}else setSync(false,"Local workspace · not connected")}catch(e){dbc=null;setSync(false,"Local workspace · sync unavailable")}})();
</script>
</body>
</html>
